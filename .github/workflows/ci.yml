name: Quality checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "^22.23.4"
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Select checks for the complete pull request
        id: checks
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: npm run check:scope -- "$BASE_COMMIT"
      - uses: ./.github/actions/image-cache
      - if: steps.checks.outputs.scope == 'full'
        run: npx playwright install --with-deps chromium
      - name: Check and build
        env:
          CHECK_SCOPE: ${{ steps.checks.outputs.scope }}
        run: |
          if [ "$CHECK_SCOPE" = content ]; then npm run test:content; else npm run test:ci; fi
      - name: Remove unused image cache entries
        run: node scripts/prune-image-cache.mjs
