title: Hospitation für externe Interessierte
category: Kennenlernen
date: "2027-06-01"
time: 7:55–12:00 Uhr
location: Montessori-Schule Allgäu, Klosterstraße 8
description: Ihr interessiert euch für unsere pädagogische Arbeit und möchtet Montessori im Schulalltag erleben? Im Rahmen einer Hospitation könnt ihr Einblicke in unsere Klassen gewinnen und unsere Arbeit kennenlernen, zum Beispiel als Pädagogin oder Pädagoge, im Rahmen einer Ausbildung oder aus fachlichem Interesse. Von 11:30 Uhr bis 12:00 Uhr besteht die Möglichkeit zum Austausch mit einer Klassenleitung. Die Anmeldung erfolgt über das Schulbüro und ist bis spätestens eine Woche vor dem jeweiligen Termin möglich.
status: published
