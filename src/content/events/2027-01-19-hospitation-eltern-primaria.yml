title: Hospitation für externe Eltern in der Primaria (1.–4. Klasse)
category: Kennenlernen
date: "2027-01-19"
time: 9:55–12:00 Uhr
location: Montessori-Schule Allgäu, Klosterstraße 8
description: Ihr interessiert euch für unsere Schule und möchtet einen Einblick in den Alltag unserer Primaria bekommen? Bei einer Hospitation könnt ihr die Arbeit in unseren Klassen kennenlernen und erleben, wie wir Montessori im Schulalltag leben. Von 11:30 Uhr bis 12:00 Uhr besteht die Möglichkeit zum Austausch mit einer Klassenleitung. Die Anmeldung erfolgt über das Schulbüro und ist bis spätestens eine Woche vor dem jeweiligen Termin möglich.
status: published
